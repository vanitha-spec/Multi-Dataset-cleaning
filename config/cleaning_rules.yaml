customers:

  required_columns:
    - customer_id
    - customer_name
    - age
    - gender
    - city
    - email

  required_values:
    - customer_id
    - customer_name

  gender_mapping:
    Male: Male
    male: Male
    MALE: Male
    M: Male
    m: Male
    Female: Female
    female: Female
    FEMALE: Female
    F: Female
    f: Female

  age:
    minimum: 18
    maximum: 100

  unique_columns:
    - customer_id

  email_columns:
    - email


